name = "zyl"
main = "src/index.ts"
compatibility_date = "2026-07-20"
workers_dev = false

# zylin.yashpatil.dev is a custom domain configured in the Cloudflare dashboard.
# Keep it outside this file so CI only needs Worker script permissions.

[[routes]]
pattern = "*.zylin.yashpatil.dev/*"
zone_name = "yashpatil.dev"

[env.dev]
name = "url-shortener-api-dev"
workers_dev = true
routes = []

# Set secrets before deployment:
# wrangler secret put SUPABASE_URL --config worker/wrangler.toml
# wrangler secret put SUPABASE_PUBLISHABLE_KEY --config worker/wrangler.toml
# wrangler secret put SUPABASE_SERVICE_ROLE_KEY --config worker/wrangler.toml
